name: build-app

on:
  workflow_dispatch:
    inputs:
      marker:
        description: 'build marker / release tag'
        required: true
      mode:
        description: 'build mode'
        required: false
        default: zip
      java:
        description: 'JDK version'
        required: false
        default: '17'
      gradle:
        description: 'Gradle version to install (empty = use gradlew)'
        required: false
        default: ''
      godot:
        description: 'Godot version (godot mode)'
        required: false
        default: '4.3'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HAS_KEYSTORE: ${{ secrets.CSHOP_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ github.event.inputs.java || '17' }}

      - name: Unpack project
        run: |
          rm -rf android-project
          mkdir -p android-project
          unzip -oq project/project.zip -d android-project

      - name: Set up Android SDK (project mode)
        if: github.event.inputs.mode == 'project' || github.event.inputs.mode == 'godot'
        continue-on-error: true
        uses: android-actions/setup-android@v3

      - name: Check Android SDK is available
        if: github.event.inputs.mode == 'project' || github.event.inputs.mode == 'godot'
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME" || { echo "::error::Android SDK not found on the runner"; exit 1; }

      - name: Set up Python (project mode, for Chaquopy)
        if: github.event.inputs.mode == 'project'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Gradle (project mode, no wrapper jar)
        if: github.event.inputs.mode == 'project' && github.event.inputs.gradle != ''
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ github.event.inputs.gradle }}

      - name: Restore keystore
        if: env.HAS_KEYSTORE == 'true' && github.event.inputs.mode != 'godot'
        run: |
          mkdir -p android-project/app
          echo "${{ secrets.CSHOP_KEYSTORE_BASE64 }}" | base64 -d > android-project/app/release.keystore

      - name: Verify keystore
        if: env.HAS_KEYSTORE == 'true' && github.event.inputs.mode != 'godot'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.CSHOP_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CSHOP_KEY_ALIAS }}
        run: |
          test -f android-project/app/release.keystore || { echo "::error::Keystore file was not created"; exit 1; }
          keytool -list -keystore android-project/app/release.keystore -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null || { echo "::error::Keystore password or key alias is wrong"; exit 1; }

      - name: Make gradlew executable
        run: chmod +x android-project/gradlew || true

      - name: Build debug APK
        if: github.event.inputs.mode != 'project' && github.event.inputs.mode != 'godot'
        working-directory: android-project
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build release APK + AAB
        if: github.event.inputs.mode != 'project' && github.event.inputs.mode != 'godot'
        working-directory: android-project
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/android-project/app/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.CSHOP_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CSHOP_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.CSHOP_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Build project debug APK
        if: github.event.inputs.mode == 'project'
        working-directory: android-project
        run: |
          if [ -f gradlew ] && [ -f gradle/wrapper/gradle-wrapper.jar ]; then G=./gradlew; else G=gradle; fi
          $G -I cshop-init.gradle assembleDebug --no-daemon --stacktrace

      - name: Build project release APK + AAB
        if: github.event.inputs.mode == 'project' && env.HAS_KEYSTORE == 'true'
        working-directory: android-project
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/android-project/app/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.CSHOP_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CSHOP_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.CSHOP_KEY_PASSWORD }}
        run: |
          if [ -f gradlew ] && [ -f gradle/wrapper/gradle-wrapper.jar ]; then G=./gradlew; else G=gradle; fi
          $G -I cshop-init.gradle assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Install Android SDK packages (godot mode)
        if: github.event.inputs.mode == 'godot'
        run: |
          SDKM=$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platform-tools" "build-tools;33.0.2" "build-tools;34.0.0" "build-tools;35.0.1" "platforms;android-33" "platforms;android-34" "platforms;android-35" > /dev/null

      - name: Install Godot and export templates (godot mode)
        if: github.event.inputs.mode == 'godot'
        env:
          GODOT_VERSION: ${{ github.event.inputs.godot || '4.3' }}
        run: |
          V="$GODOT_VERSION"
          BASE="https://github.com/godotengine/godot/releases/download/$V-stable"
          mkdir -p "$HOME/godot" && cd "$HOME/godot"
          curl -fsSL -o godot.zip "$BASE/Godot_v$V-stable_linux.x86_64.zip"
          curl -fsSL -o templates.tpz "$BASE/Godot_v$V-stable_export_templates.tpz"
          unzip -q godot.zip
          mv "Godot_v$V-stable_linux.x86_64" godot
          chmod +x godot
          mkdir -p "$HOME/.local/share/godot/export_templates/$V.stable"
          unzip -q templates.tpz -d tpl
          cp -r tpl/templates/* "$HOME/.local/share/godot/export_templates/$V.stable/"
          ./godot --version

      - name: Export Godot project to APK (godot mode)
        if: github.event.inputs.mode == 'godot'
        working-directory: android-project
        env:
          MARKER: ${{ github.event.inputs.marker }}
          KS_B64: ${{ secrets.CSHOP_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.CSHOP_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.CSHOP_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.CSHOP_KEY_PASSWORD }}
        run: |
          GODOT="$HOME/godot/godot"
          keytool -genkeypair -keystore "$RUNNER_TEMP/debug.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 9999 -dname "CN=Android Debug,O=Android,C=US" > /dev/null
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$RUNNER_TEMP/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$RUNNER_TEMP/debug.keystore"
          export GODOT_ANDROID_KEYSTORE_DEBUG_USER="androiddebugkey"
          export GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD="android"
          "$GODOT" --headless --import > "$RUNNER_TEMP/import.log" 2>&1 || true
          tail -n 30 "$RUNNER_TEMP/import.log"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          "$GODOT" --headless --export-debug "Android" "$GITHUB_WORKSPACE/dist/app-$MARKER-debug.apk" 2>&1 | tail -n 80 || true
          test -s "$GITHUB_WORKSPACE/dist/app-$MARKER-debug.apk" || { echo "::error::Godot export failed (see the log above)"; exit 1; }
          if [ "$HAS_KEYSTORE" = "true" ]; then
            if [ "$KEY_PASS" != "$KS_PASS" ]; then echo "::warning::Godot uses one password for both keystore and key"; fi
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            export GODOT_ANDROID_KEYSTORE_RELEASE_PATH="$RUNNER_TEMP/release.keystore"
            export GODOT_ANDROID_KEYSTORE_RELEASE_USER="$KS_ALIAS"
            export GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD="$KS_PASS"
            "$GODOT" --headless --export-release "Android" "$GITHUB_WORKSPACE/dist/app-$MARKER.apk" 2>&1 | tail -n 80 || true
            test -s "$GITHUB_WORKSPACE/dist/app-$MARKER.apk" || { echo "::error::Godot release export failed (check keystore password and alias)"; exit 1; }
          fi

      - name: Collect outputs
        run: |
          MARKER="${{ github.event.inputs.marker }}"
          DEBUG_APK=$(find android-project -path '*/build/outputs/apk/debug/*.apk' | head -n1)
          RELEASE_APK=$(find android-project -path '*/build/outputs/apk/release/*.apk' | head -n1)
          RELEASE_AAB=$(find android-project -path '*/build/outputs/bundle/release/*.aab' | head -n1)
          mkdir -p dist
          [ -n "$DEBUG_APK" ] && cp "$DEBUG_APK" "dist/app-${MARKER}-debug.apk"
          [ -n "$RELEASE_APK" ] && cp "$RELEASE_APK" "dist/app-${MARKER}.apk"
          [ -n "$RELEASE_AAB" ] && cp "$RELEASE_AAB" "dist/app-${MARKER}.aab"
          ls -la dist

      - name: Verify release signature
        if: env.HAS_KEYSTORE == 'true'
        run: |
          APK=$(ls dist/app-*.apk | grep -v -- '-debug.apk' | head -n1)
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -n1)
          if [ -z "$APKSIGNER" ]; then echo "apksigner not found, skipping check"; exit 0; fi
          "$APKSIGNER" verify --print-certs "$APK" | tee cert.txt
          if grep -qi "Android Debug" cert.txt; then echo "::error::Release APK is still signed with the debug key"; exit 1; fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.marker }}
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
