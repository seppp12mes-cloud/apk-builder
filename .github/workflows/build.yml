name: build-app

on:
  workflow_dispatch:
    inputs:
      marker:
        description: 'build marker / release tag'
        required: true
      mode:
        description: 'build mode'
        required: false
        default: zip

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Unpack project
        run: |
          rm -rf android-project
          mkdir -p android-project
          unzip -oq project/project.zip -d android-project

      - name: Restore keystore
        if: ${{ secrets.CSHOP_KEYSTORE_BASE64 != '' }}
        run: |
          mkdir -p android-project/app
          echo "${{ secrets.CSHOP_KEYSTORE_BASE64 }}" | base64 -d > android-project/app/release.keystore

      - name: Make gradlew executable
        run: chmod +x android-project/gradlew

      - name: Build debug APK
        working-directory: android-project
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build release APK + AAB
        working-directory: android-project
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/android-project/app/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.CSHOP_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CSHOP_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.CSHOP_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Collect outputs
        run: |
          MARKER="${{ github.event.inputs.marker }}"
          DEBUG_APK=$(find android-project/app/build/outputs/apk/debug -name "*.apk" | head -n1)
          RELEASE_APK=$(find android-project/app/build/outputs/apk/release -name "*.apk" | head -n1)
          RELEASE_AAB=$(find android-project/app/build/outputs/bundle/release -name "*.aab" | head -n1)
          mkdir -p dist
          [ -n "$DEBUG_APK" ] && cp "$DEBUG_APK" "dist/app-${MARKER}-debug.apk"
          [ -n "$RELEASE_APK" ] && cp "$RELEASE_APK" "dist/app-${MARKER}.apk"
          [ -n "$RELEASE_AAB" ] && cp "$RELEASE_AAB" "dist/app-${MARKER}.aab"
          ls -la dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.marker }}
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
