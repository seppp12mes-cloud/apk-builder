name: build

on:
  workflow_dispatch:
    inputs:
      marker:
        description: "شناسه‌ی یکتای این ساخت"
        required: true
      mode:
        description: "نوع ساخت: web (پیش‌فرض) یا zip"
        required: false
        default: "web"

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK (already installed on the runner)
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          SDKMANAGER=$(find /usr/local/lib/android/sdk -name sdkmanager | head -n 1)
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Node
        if: ${{ github.event.inputs.mode != 'zip' }}
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Cordova
        if: ${{ github.event.inputs.mode != 'zip' }}
        run: npm install -g cordova

      - name: Scaffold Cordova project from submitted HTML
        if: ${{ github.event.inputs.mode != 'zip' }}
        run: |
          cordova create app com.example.builtapp BuiltApp
          cp www/index.html app/www/index.html
          cd app
          cordova platform add android

      - name: Build debug APK (Cordova / web app)
        if: ${{ github.event.inputs.mode != 'zip' }}
        run: |
          cd app
          cordova build android

      - name: Build debug APK (native Android project / Kotlin)
        if: ${{ github.event.inputs.mode == 'zip' }}
        run: |
          mkdir -p app
          unzip -q project/project.zip -d app
          PROJECT_DIR=$(dirname "$(find app -maxdepth 3 \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          cd "$PROJECT_DIR"
          chmod +x gradlew
          # اگر پروژه جاوا و کاتلین را روی دو نسخه‌ی متفاوت گذاشته بود، به‌جای خطا فقط هشدار بده
          printf '\nkotlin.jvm.target.validation.mode=warning\n' >> gradle.properties
          ./gradlew assembleDebug --no-daemon

      - name: Locate APK
        id: apk
        run: |
          APK=$(find app -name "*.apk" | head -n 1)
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Publish as a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.marker }}
          files: ${{ steps.apk.outputs.path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
