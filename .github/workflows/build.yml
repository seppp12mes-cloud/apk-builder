name: build

on:
  workflow_dispatch:
    inputs:
      marker:
        description: "شناسه‌ی یکتای این ساخت"
        required: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK (already installed on the runner)
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          SDKMANAGER=$(find /usr/local/lib/android/sdk -name sdkmanager | head -n 1)
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install Cordova
        run: npm install -g cordova

      - name: Scaffold Cordova project from submitted HTML
        run: |
          cordova create app com.example.builtapp BuiltApp
          cp www/index.html app/www/index.html
          cd app
          cordova platform add android

      - name: Build debug APK
        run: |
          cd app
          cordova build android

      - name: Locate APK
        id: apk
        run: |
          APK=$(find app/platforms/android -name "*.apk" | head -n 1)
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Publish as a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.marker }}
          files: ${{ steps.apk.outputs.path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
