name: build

on:
  workflow_dispatch:
    inputs:
      marker:
        description: "شناسه‌ی یکتای این ساخت"
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Cordova
        run: npm install -g cordova

      - name: Scaffold Cordova project from submitted HTML
        run: |
          cordova create app com.example.builtapp BuiltApp
          cp www/index.html app/www/index.html
          cd app
          cordova platform add android

      - name: Build debug APK
        run: |
          cd app
          cordova build android

      - name: Locate APK
        id: apk
        run: |
          APK=$(find app/platforms/android -name "*.apk" | head -n 1)
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Publish as a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.marker }}
          files: ${{ steps.apk.outputs.path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
