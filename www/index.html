<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>شمارنده</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
         background: #2340f0; color: #fff; font-family: sans-serif; text-align: center; }
  #n { font-size: 96px; font-weight: 800; }
  button { width: 72px; height: 72px; margin: 8px; border: 0; border-radius: 50%;
           font-size: 30px; background: #ffc531; color: #101b3b; }
</style>
</head>
<body>
  <main>
    <div id="n">0</div>
    <button id="minus">−</button>
    <button id="plus">+</button>
  </main>
<script>
  let n = 0;
  const el = document.getElementById("n");
  document.getElementById("plus").onclick = () => { el.textContent = ++n; };
  document.getElementById("minus").onclick = () => { el.textContent = --n; };
</script>
</body>
</html>
